# Compose v2 syntax (Docker 20.10+, fonctionne parfaitement avec Docker 29)
# Lancer avec : docker compose up -d --build (sans tiret entre docker et compose)

name: blogsite-cm

services:

  mysql:
    image: mysql:8.0
    container_name: blogsite-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-blogsite_db}
      MYSQL_USER: ${DB_USER:-boutique}
      MYSQL_PASSWORD: ${DB_PASSWORD:-boutique}
      TZ: Africa/Douala
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - blogsite-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blogsite-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-blogsite_db}
      DB_USER: ${DB_USER:-boutique}
      DB_PASSWORD: ${DB_PASSWORD:-boutique}
      JWT_SECRET: ${JWT_SECRET:-changeme-au-moins-64-caracteres-pour-le-developpement-local-blogsite-cm-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost}
      TZ: Africa/Douala
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    networks:
      - blogsite-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blogsite-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - blogsite-net

networks:
  blogsite-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
