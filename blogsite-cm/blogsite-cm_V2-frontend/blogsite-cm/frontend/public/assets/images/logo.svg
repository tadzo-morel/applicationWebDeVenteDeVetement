<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" role="img" aria-label="blogSite Cameroun">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee6c4d"/>
      <stop offset="100%" stop-color="#d75c40"/>
    </linearGradient>
  </defs>

  <!-- Carre orange decoratif (rappel logo DIVA) -->
  <rect x="6" y="14" width="14" height="14" rx="1.5" fill="url(#g1)"/>
  <rect x="6" y="32" width="14" height="14" rx="1.5" fill="#1a1a1a"/>

  <!-- Texte "blogSite" -->
  <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">blog</text>
  <text x="79" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="700" fill="#ee6c4d" letter-spacing="-0.5">Site</text>

  <!-- Sous-titre Cameroun -->
  <text x="30" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="9" font-weight="500" fill="#888" letter-spacing="2">CAMEROUN</text>
</svg>
